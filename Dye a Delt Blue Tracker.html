<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dye a Delt Blue Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="css">
/* One blue world, matching the Dye a Delt Blue poster: electric blue ground, navy cards, yellow highlights. */
:root{
  --blue:#1F3BFF; --navy:#0B1640; --yellow:#FFD23F; --white:#ffffff;
  --mist:rgba(255,255,255,0.72); --line:rgba(255,255,255,0.18);
  --display:'Bricolage Grotesque', 'Arial Black', sans-serif;
  --body:Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--blue);color:var(--white);font-family:var(--body);}
body{min-height:100%;}
.wrap{max-width:880px;margin:0 auto;padding:40px 20px 56px;display:flex;flex-direction:column;gap:28px;}
.eyebrow{margin:0;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow);}
h1{margin:6px 0 0;font-family:var(--display);font-weight:800;font-size:clamp(48px,11vw,96px);line-height:.9;letter-spacing:-.03em;text-wrap:balance;}
.tiers{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;}
.tier{display:flex;align-items:baseline;gap:8px;background:var(--white);color:var(--navy);border-radius:999px;padding:8px 16px;font-weight:600;font-size:15px;}
.tier b{font-family:var(--display);font-size:20px;font-weight:800;}
.card{background:var(--navy);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:18px;}
.total-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;}
.big{font-family:var(--display);font-weight:800;font-size:clamp(40px,9vw,64px);line-height:1;font-variant-numeric:tabular-nums;}
.of{color:var(--mist);font-size:16px;font-weight:500;}
.bar{height:22px;border-radius:11px;background:var(--line);overflow:hidden;}
.bar > span{display:block;height:100%;background:var(--yellow);border-radius:11px;}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
.stat{border:1px solid var(--line);border-radius:16px;padding:14px;}
.stat b{display:block;font-family:var(--display);font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;}
.stat span{font-size:13px;color:var(--mist);}
h2{margin:0;font-family:var(--display);font-size:28px;font-weight:800;}
.board{display:flex;flex-direction:column;gap:10px;}
.row{background:var(--white);color:var(--navy);border-radius:18px;padding:14px 16px;display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:6px 12px;align-items:center;}
.rank{font-family:var(--display);font-weight:800;font-size:20px;color:#5a6690;text-align:center;}
.name{font-weight:700;font-size:17px;overflow-wrap:anywhere;}
.amt{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;text-align:right;}
.track{grid-column:2 / 4;display:flex;align-items:center;gap:10px;}
.mini{position:relative;flex:1;height:10px;border-radius:5px;background:#e3e7f3;}
.mini > span{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--blue);}
.mini.short{flex:0 1 30%;min-width:56px;}
.track .pill{margin-left:auto;}
.mini > i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--navy);left:25%;}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap;}
.p0{background:#e3e7f3;color:#3b4a7a;}
.p1{background:var(--blue);color:var(--white);}
.p2{background:var(--yellow);color:var(--navy);}
.brow{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--blue);vertical-align:middle;}
.chk{flex-direction:row;align-items:center;gap:6px;font-size:13px;}
.chk input{width:20px;height:20px;padding:0;}
.next{grid-column:2 / 4;font-size:13px;color:#4a5680;}
.empty{background:var(--navy);border-radius:18px;padding:24px;color:var(--mist);text-align:center;}
.info{display:flex;flex-wrap:wrap;gap:12px 28px;border-top:1px solid var(--line);padding-top:20px;font-size:15px;}
.info b{color:var(--yellow);}
.venmo{font-family:var(--display);font-weight:800;font-size:28px;color:var(--yellow);}
.updated{font-size:13px;color:var(--mist);}
/* organizer panel */
.orgbtn{align-self:flex-start;background:transparent;color:var(--mist);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:600 13px var(--body);cursor:pointer;}
.orgbtn:hover{color:var(--white);border-color:var(--white);}
.panel{background:var(--white);color:var(--navy);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:16px;}
.panel h3{margin:0;font-family:var(--display);font-size:22px;}
.panel p{margin:0;font-size:14px;color:#4a5680;}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:#3b4a7a;}
input{font:500 15px var(--body);padding:10px 12px;border:1.5px solid #c9d0e6;border-radius:10px;color:var(--navy);background:var(--white);min-width:0;}
input:focus-visible,button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;}
.erow{display:grid;grid-template-columns:minmax(0,1fr) 92px auto;gap:8px;align-items:center;border-top:1px solid #e3e7f3;padding-top:10px;}
.quick{display:flex;gap:4px;flex-wrap:wrap;}
.quick button,.add button,.del{font:700 13px var(--body);border:none;border-radius:8px;padding:9px 10px;cursor:pointer;min-height:40px;}
.quick button{background:#e3e7f3;color:var(--navy);}
.quick button:hover{background:#c9d0e6;}
.del{background:transparent;color:#a3242a;}
.add{display:flex;gap:8px;}
.add input{flex:1;}
.add button{background:var(--navy);color:var(--white);padding:9px 16px;}
.save{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--white);padding-top:10px;}
.save button{font:800 16px var(--body);background:var(--blue);color:var(--white);border:none;border-radius:12px;padding:12px 22px;cursor:pointer;}
.save button:disabled{opacity:.5;cursor:default;}
.msg{font-size:14px;font-weight:600;}
@media (max-width:520px){
  .stats{grid-template-columns:1fr 1fr 1fr;}
  .stat b{font-size:24px;}
  .fields{grid-template-columns:1fr;}
  .erow{grid-template-columns:minmax(0,1fr) 80px;}
  .erow .quick{grid-column:1 / 3;}
}
@media (prefers-reduced-motion:no-preference){.bar > span,.mini > span{transition:width .4s ease;}}
</style>
</head>
<body>
<script type="application/json" id="state">{"goal":1250,"venmo":"","closes":"","location":"","updated":"","delts":[{"name":"Bryce Warner","raised":0,"brows":true},{"name":"Nash Philips","raised":0,"brows":true},{"name":"Owen Lee","raised":0,"brows":true},{"name":"Micheal Fahrety","raised":0,"brows":true},{"name":"Sirak Nephtalem","raised":0,"brows":true},{"name":"Ben Harrington","raised":0,"brows":true},{"name":"Conor Sargent","raised":0},{"name":"Diego Boord","raised":0},{"name":"Rivan Nath","raised":0},{"name":"Noah Gordon","raised":0},{"name":"Evan Perazzo","raised":0},{"name":"Alex Kim","raised":0},{"name":"Jack Murdock","raised":0},{"name":"John-Henry Larson","raised":0},{"name":"Nathan Riesenburger","raised":0},{"name":"Conor Scheidt","raised":0},{"name":"Ben Doolittle","raised":0,"brows":true},{"name":"Elliot Yoder","raised":0},{"name":"Kaden Ellini","raised":0,"brows":true},{"name":"Noah Hirokawa","raised":0},{"name":"Zach Andrews","raised":0},{"name":"Gus Goyal","raised":0},{"name":"Leo Zupko","raised":0},{"name":"Drayson Jaffee","raised":0},{"name":"Eli Stein","raised":0},{"name":"Jake Maynor","raised":0},{"name":"Nick Heise","raised":0},{"name":"Jack Gehring","raised":0},{"name":"Marco Hartano","raised":0}]}</script>
<main class="wrap" id="root"></main>
<script id="app">
(function(){
  var CSS = document.getElementById('css').textContent;
  var APP = document.getElementById('app').textContent;
  var saved = JSON.parse(document.getElementById('state').textContent);
  var state = JSON.parse(JSON.stringify(saved));
  var root = document.getElementById('root');
  var artifact = null, editing = false, dirty = false, msg = '';

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function money(n){n=Number(n)||0;return '$'+(Math.round(n*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});}
  function tier(r,b){return (b&&r>=200)?2:(r>=50?1:0);}
  var LABEL=['Not yet','Blue hair','Hair + eyebrows'];
  function nextText(r,b){
    if(b&&r>=200) return 'Maxed out: blue hair and eyebrows for a week';
    if(b&&r>=50) return money(200-r)+' more until his eyebrows go blue too';
    if(r>=50) return 'Goal hit: he goes blue for a week';
    return money(50-r)+' more until he goes blue';
  }

  function viewHTML(s){
    var total=s.delts.reduce(function(a,d){return a+(Number(d.raised)||0);},0);
    var goal=Number(s.goal)||1250;
    var pct=Math.min(100,goal?total/goal*100:0);
    var blue=s.delts.filter(function(d){return d.raised>=50;}).length;
    var brows=s.delts.filter(function(d){return d.brows&&d.raised>=200;}).length;
    var browsN=s.delts.filter(function(d){return d.brows;}).length;
    var list=s.delts.map(function(d,i){return {name:d.name,raised:Number(d.raised)||0,brows:!!d.brows,i:i};})
      .sort(function(a,b){return b.raised-a.raised||a.i-b.i;});
    var rows=list.length?list.map(function(d,k){
      var t=tier(d.raised,d.brows), cap=d.brows?200:50, w=Math.min(100,d.raised/cap*100);
      return '<div class="row"><div class="rank">'+(k+1)+'</div><div class="name">'+esc(d.name)+(d.brows?' <span class="brow">eyebrows on the line</span>':'')+'</div>'+
        '<div class="amt">'+money(d.raised)+'</div>'+
        '<div class="track"><div class="mini'+(d.brows?'':' short')+'" aria-hidden="true"><span style="width:'+w+'%"></span>'+(d.brows?'<i></i>':'')+'</div>'+
        '<span class="pill p'+t+'">'+LABEL[t]+'</span></div>'+
        '<div class="next">'+esc(nextText(d.raised,d.brows))+'</div></div>';
    }).join(''):'<div class="empty">No Delts on the board yet. Check back soon.</div>';
    var info=[];
    if(s.venmo) info.push('<div><div class="updated">Donate on Venmo, his name in the note</div><div class="venmo">@'+esc(s.venmo.replace(/^@/,''))+'</div></div>');
    if(s.closes) info.push('<div><div class="updated">Donations close</div><b>'+esc(s.closes)+'</b></div>');
    if(s.location) info.push('<div><div class="updated">Dye day</div><b>'+esc(s.location)+'</b></div>');
    return '<header><p class="eyebrow">Delta Tau Delta · Beta Pi × Breakthrough T1D</p>'+
      '<h1>Dye a Delt Blue.</h1>'+
      '<div class="tiers"><span class="tier"><b>$50</b> blue hair for a week</span><span class="tier"><b>$200</b> blue eyebrows too ('+browsN+' brave Delts)</span></div></header>'+
      '<section class="card" aria-label="Chapter total"><div class="total-row"><div><div class="big">'+money(total)+'</div><div class="of">raised of '+money(goal)+' chapter goal</div></div>'+
      '<div class="of">'+Math.round(pct)+'%</div></div>'+
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+goal+'" aria-valuenow="'+total+'"><span style="width:'+pct+'%"></span></div>'+
      '<div class="stats"><div class="stat"><b>'+blue+'</b><span>Delts gone blue</span></div><div class="stat"><b>'+brows+'</b><span>eyebrows too</span></div><div class="stat"><b>'+s.delts.length+'</b><span>Delts in</span></div></div></section>'+
      '<section class="board" aria-label="Leaderboard"><h2>Leaderboard</h2>'+rows+'</section>'+
      (info.length?'<section class="info">'+info.join('')+'</section>':'')+
      (s.updated?'<p class="updated">Last updated '+esc(s.updated)+'</p>':'')+
      '<p class="updated">Every dollar goes to Breakthrough T1D for type 1 diabetes research.</p>';
  }

  function panelHTML(){
    var rows=state.delts.map(function(d,i){
      return '<div class="erow"><label>Delt<input id="n'+i+'" data-i="'+i+'" data-f="name" value="'+esc(d.name)+'"></label>'+
        '<label>Raised ($)<input id="r'+i+'" data-i="'+i+'" data-f="raised" type="number" min="0" step="1" inputmode="decimal" value="'+(Number(d.raised)||0)+'"></label>'+
        '<div class="quick"><label class="chk"><input type="checkbox" id="b'+i+'" data-i="'+i+'" data-f="brows"'+(d.brows?' checked':'')+'>Eyebrows</label><button data-add="5" data-i="'+i+'">+5</button><button data-add="10" data-i="'+i+'">+10</button><button data-add="20" data-i="'+i+'">+20</button><button class="del" data-del="'+i+'" aria-label="Remove '+esc(d.name)+'">Remove</button></div></div>';
    }).join('');
    return '<section class="panel" aria-label="Organizer controls"><h3>Update the tracker</h3>'+
      '<p>Type a new total or tap +5 / +10 / +20 when a Venmo comes in, then press Save. Only you can save: everyone else just sees the board.</p>'+
      '<div class="fields"><label>Chapter goal ($)<input id="goal" data-s="goal" type="number" min="0" value="'+esc(state.goal)+'"></label>'+
      '<label>Venmo handle<input id="venmo" data-s="venmo" placeholder="@yourhandle" value="'+esc(state.venmo)+'"></label>'+
      '<label>Donations close<input id="closes" data-s="closes" placeholder="Fri, Dec 4 · 5 PM" value="'+esc(state.closes)+'"></label>'+
      '<label>Dye day location<input id="location" data-s="location" placeholder="Delt house lawn" value="'+esc(state.location)+'"></label></div>'+
      rows+
      '<form class="add" id="addform"><input id="newname" placeholder="Add a Delt by name" aria-label="New Delt name"><button type="submit">Add</button></form>'+
      '<div class="save"><button id="savebtn"'+(dirty?'':' disabled')+'>Save and publish</button><span class="msg" id="msg">'+esc(msg||(dirty?'Unsaved changes':''))+'</span></div></section>';
  }

  function render(){
    var html=viewHTML(state);
    if(artifact){ html+= editing? panelHTML() : '<button class="orgbtn" id="orgbtn">Organizer: update tracker</button>'; }
    var f=document.activeElement&&document.activeElement.id;
    root.innerHTML=html;
    if(f){var el=document.getElementById(f); if(el){el.focus(); if(el.setSelectionRange&&el.type!=='number'){try{el.setSelectionRange(el.value.length,el.value.length);}catch(e){}}}}
  }

  function touch(){dirty=true;msg='';var b=document.getElementById('savebtn');if(b)b.disabled=false;var m=document.getElementById('msg');if(m)m.textContent='Unsaved changes';}

  root.addEventListener('input',function(e){
    var t=e.target;
    if(t.dataset.s){state[t.dataset.s]=t.dataset.s==='goal'?(Number(t.value)||0):t.value;touch();refreshView();return;}
    if(t.dataset.f){var d=state.delts[+t.dataset.i]; if(t.dataset.f==='raised'){d.raised=Math.max(0,Number(t.value)||0);}else if(t.dataset.f==='brows'){if(t.checked){d.brows=true;}else{delete d.brows;}}else{d.name=t.value;} touch(); refreshView();}
  });
  function refreshView(){
    // re-render only the public view part so inputs keep focus
    var panel=root.querySelector('.panel'); var tmp=document.createElement('div'); tmp.innerHTML=viewHTML(state);
    while(root.firstChild&&root.firstChild!==panel) root.removeChild(root.firstChild);
    while(tmp.firstChild) root.insertBefore(tmp.firstChild,panel);
  }
  root.addEventListener('click',function(e){
    var t=e.target;
    if(t.id==='orgbtn'){editing=true;render();return;}
    if(t.dataset.add){var d=state.delts[+t.dataset.i]; d.raised=(Number(d.raised)||0)+Number(t.dataset.add); touch(); render(); return;}
    if(t.dataset.del){state.delts.splice(+t.dataset.del,1); touch(); render(); return;}
    if(t.id==='savebtn'){save();}
  });
  root.addEventListener('submit',function(e){
    e.preventDefault(); var inp=document.getElementById('newname'); var n=inp.value.trim(); if(!n) return;
    state.delts.push({name:n,raised:0}); touch(); render(); var x=document.getElementById('newname'); if(x) x.focus();
  });

  function buildDoc(s){
    var json=JSON.stringify(s).replace(/</g,'\\u003c');
    return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Dye a Delt Blue Tracker</title>\n'+
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+
      '<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">\n'+
      '<style id="css">'+CSS+'</style>\n</head>\n<body>\n<script type="application/json" id="state">'+json+'<\/script>\n<main class="wrap" id="root"></main>\n<script id="app">'+APP+'<\/script>\n</body>\n</html>\n';
  }

  async function save(){
    if(!artifact||!dirty) return;
    state.delts=state.delts.filter(function(d){return String(d.name).trim();});
    state.updated=new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:'America/Chicago'})+' CT';
    var b=document.getElementById('savebtn'); if(b) b.disabled=true;
    var m=document.getElementById('msg'); if(m) m.textContent='Publishing…';
    try{ await artifact.publish(buildDoc(state)); dirty=false; msg='Saved. Everyone now sees this.'; }
    catch(err){
      var code=(err&&(err.code||err.name||err.message))||'';
      msg=/not_writer|not_granted/.test(code)?'Only the organizer can update this tracker.':(/conflict/.test(code)?'Someone else saved first. The page will reload.':'Could not save. Try again.');
      if(b) b.disabled=false;
    }
    var m2=document.getElementById('msg'); if(m2) m2.textContent=msg;
  }

  render();
  if(window.claude&&window.claude.use){
    window.claude.use('artifact').then(function(a){ if(a){artifact=a; render();} }).catch(function(){});
  }
})();
</script>
</body>
</html>
